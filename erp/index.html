<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEMAD ERP</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17304c;font:16px system-ui}header{background:#102b4b;color:white;padding:22px;display:flex;align-items:center;gap:16px}header img{width:52px}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0;font-size:24px}small{color:#64748b}.notice,section{background:white;border:1px solid #dce4ee;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}button{font:inherit;border:1px solid #dce4ee;background:white;color:#17304c;border-radius:8px;padding:18px;text-align:left;cursor:pointer}button:hover{border-color:#b99a53}input,select{padding:10px;border:1px solid #ccd5df;border-radius:6px;width:100%;font:inherit}label{display:block;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left} .scroll{overflow:auto} .primary{background:#173b64;color:white;padding:10px 18px}footer{padding:20px;text-align:center;color:#64748b}header{position:sticky;top:0;z-index:3;border-bottom:3px solid #c4a45f}main{max-width:1250px}.grid button{display:flex;flex-direction:column;gap:9px;min-height:88px;font-weight:600;box-shadow:0 2px 6px #17304c08}.grid button span{font-size:23px;color:#987735}.grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#fff;padding:14px;border-radius:9px;border-left:3px solid #c4a45f}.stats strong{display:block;font-size:25px}.notice{font-size:13px;padding:12px}textarea{width:100%;min-height:80px;padding:10px;border:1px solid #ccd5df;border-radius:6px}@media(max-width:600px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}header{padding:12px}section{padding:14px}td input{min-width:90px}}main{max-width:none;padding:0}.notice{margin:0;border-radius:0;padding:8px 16px}.notice p{margin:4px 0}.workspace{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:75vh;background:white}nav{background:#f4f7fb;border-right:1px solid #dce4ee;padding:16px 8px}nav h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:0 10px;color:#64748b}#modules{display:flex;flex-direction:column;gap:0}#modules button{display:flex;align-items:center;gap:10px;border:0;border-radius:0;background:transparent;padding:12px 10px;font-size:14px;text-align:left;min-height:0;box-shadow:none;font-weight:500}#modules button span{width:20px;flex-shrink:0;text-align:center;color:#987735;font-size:17px}#modules button:hover,#modules button.active{background:#e5edf7;color:#102b4b}#modules button.active{box-shadow:inset 3px 0 #b99a53}#panel{margin:0;border:0;border-radius:0;padding:24px;min-width:0;background:white;overflow:auto}#panel:empty{min-height:75vh}@media(max-width:600px){.workspace{grid-template-columns:145px minmax(0,1fr)}nav{padding:10px 3px}nav h2{font-size:10px}#modules button{font-size:12px;padding:10px 5px;gap:5px;overflow-wrap:anywhere}#modules button span{width:15px;font-size:14px}#panel{padding:12px}#panel h2{font-size:18px}#panel input,#panel select{min-width:0}header h1{font-size:20px}}[hidden]{display:none!important}#login{max-width:420px;margin:40px auto;padding:24px}#account{margin-left:auto;font-size:13px}#logout{padding:7px}#loginmsg{color:#a33} </style><header><img src="../logo-semad.png" alt="SEMAD"><div><h1>SEMAD ERP</h1>Saint Étienne Mwamba Développement</div><div id="account" hidden><span id="agentname"></span> <button id="logout">Déconnexion</button></div></header><section id="login"><h2>Connexion professionnelle</h2><form id="loginform"><label>Adresse e-mail<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Se connecter</button></form><p id="loginmsg" role="status"></p></section><main hidden><div class="notice"><strong>Portail en préparation</strong><p>Connexion et annuaire en test. Les formulaires de demande restent des simulations sans enregistrement.</p></div><div class="workspace"><nav aria-label="Services internes"><h2>Services internes</h2><div id="modules"></div></nav><section id="panel"></section></div></main><footer>SEMAD SARL · Version de développement 0.5</footer><script>const modules=['Suivi des projets','Approvisionnement','Finance / Cash Request','Achats et PO','Ventes','Fournisseurs','Partenariats','Stocks','Recrutement','Personnel','Annuaire','Trésorerie','Missions','Congés','Signatures','Notifications','Archives','Administration'];const panel=document.querySelector('#panel');for(const m of modules){const b=document.createElement('button');const icon=document.createElement('span');icon.textContent=['▥','▣','＄','▤','↗','◇','♧','▦','＋','♙','☷','＄','➜','▧','✓','◉','▱','⚙'][modules.indexOf(m)];b.append(icon,document.createTextNode(m));b.onclick=()=>{document.querySelectorAll('#modules button').forEach(x=>x.classList.remove('active'));b.classList.add('active');openModule(m)};document.querySelector('#modules').append(b)}function openModule(m){panel.replaceChildren();const h=document.createElement('h2');h.textContent=m;panel.append(h);if(m==='Suivi des projets'){panel.insertAdjacentHTML('beforeend','<p>Suivi des activités et des résultats par secteur — simulation.</p><label>Secteur<select id="sector"><option>Commerce</option><option>Agriculture</option><option>Élevage</option></select></label><label>Nom du projet<input></label><label>Responsable<input></label><label>Lieu<input></label><label>Date de début<input type="date"></label><label>Échéance<input type="date"></label><label>Devise<select><option>USD</option><option>CDF</option><option>EUR</option></select></label><label>Budget prévu<input type="number" min="0" step="0.01"></label><label>Dépenses réalisées<input type="number" min="0" step="0.01"></label><label>Avancement (%)<input type="number" min="0" max="100"></label><label>Statut<select><option>Planifié</option><option>En cours</option><option>Suspendu</option><option>Terminé</option></select></label><div id="sectorfields"></div><label>Activités réalisées et prochaines étapes<textarea></textarea></label><label>Difficultés et risques<textarea></textarea></label><p>Enregistrement et historique disponibles après configuration sécurisée de la base de données.</p>');const fields={Commerce:['Produits','Quantités vendues','Chiffre d’affaires'],Agriculture:['Culture','Superficie cultivée (ha)','Récolte (kg)'],Élevage:['Espèce','Effectif du cheptel','Production et état sanitaire']};const refresh=()=>{const box=document.querySelector('#sectorfields');box.replaceChildren();for(const name of fields[document.querySelector('#sector').value]){const label=document.createElement('label');label.textContent=name;label.append(document.createElement('input'));box.append(label)}};document.querySelector('#sector').onchange=refresh;refresh();return}if(m!=='Approvisionnement'){if(['Finance / Cash Request','Ventes','Partenariats','Recrutement','Missions','Congés','Trésorerie'].includes(m)){panel.insertAdjacentHTML('beforeend','<label>Titre de la demande<input required></label><label>Département<select><option>Administration</option><option>Finance</option><option>Logistique</option><option>Opérations</option><option>Sécurité</option><option>RH</option><option>Commerce</option></select></label><label>Justification<textarea></textarea></label><label>Montant (si applicable)<input type="number" min="0" step="0.01"></label><label>Devise<select><option>USD</option><option>CDF</option><option>EUR</option></select></label><h3>Signataires dans l’ordre</h3><div id="signers"></div><button id="signadd">+ Ajouter un signataire</button><p>PDF et transmission : après activation du stockage privé.</p>');document.querySelector('#signadd').onclick=()=>{const row=document.createElement('p');const input=document.createElement('input');input.placeholder='Fonction du signataire (simulation)';const b=document.createElement('button');b.textContent='Retirer';b.onclick=()=>row.remove();row.append(input,b);document.querySelector('#signers').append(row)};document.querySelector('#signadd').click();return}if(m==='Fournisseurs'){panel.insertAdjacentHTML('beforeend','<h3>Fiche de qualification</h3><label>Raison sociale<input></label><label>Adresse<input></label><label>RCCM<input></label><label>Identification nationale<input></label><label>Numéro fiscal<input></label><label>Catégorie de produits ou services<input></label><label>Statut<select><option>En qualification</option><option>Qualifié</option><option>Suspendu</option><option>Rejeté</option></select></label><p>Simulation uniquement. Aucun fournisseur enregistré.</p>');return}if(m==='Annuaire'){loadDirectory();return}if(false){panel.insertAdjacentHTML('beforeend','<label>Rechercher un agent<input type="search" placeholder="Nom, matricule, département"></label><p>Aucun agent enregistré. Annuaire disponible après activation des comptes.</p>');return}const p=document.createElement('p');p.textContent='Module prévu — activation après configuration sécurisée des comptes et de la base de données.';panel.append(p);return}panel.insertAdjacentHTML('beforeend','<label>Titre<input placeholder="Fournitures de bureau"></label><label>Projet<input></label><label>Département<select><option>Administration</option><option>Logistique</option><option>Finance</option><option>Opérations</option><option>Sécurité</option><option>RH</option><option>Commerce</option></select></label><label>Devise<select id="currency"><option>USD</option><option>CDF</option><option>EUR</option></select></label><label>Priorité<select><option>Normale</option><option>Urgente</option></select></label><div class="scroll"><table><thead><tr><th>Article</th><th>Marque</th><th>Quantité</th><th>Prix unitaire</th><th>Total</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><button class="primary" id="add">Ajouter un article</button><h3>Total : <span id="total">0</span></h3><p>Circuit fixe : Directeur des opérations → Directeur logistique → Acheteur → Directeur logistique / PO → Directeur financier → Directeur général.</p><p>Pièce PDF et soumission : indisponibles avant activation du stockage privé et des autorisations.</p>');document.querySelector('#add').onclick=add;document.querySelector('#currency').onchange=calc;add();}function add(){const tr=document.createElement('tr');tr.innerHTML='<td><input aria-label="Article"></td><td><input aria-label="Marque"></td><td><input aria-label="Quantité" type="number" min="0" value="1"></td><td><input aria-label="Prix unitaire" type="number" min="0" step="0.01" value="0"></td><td class="sum">0</td><td><button aria-label="Supprimer">×</button></td>';tr.oninput=calc;tr.querySelector('button').onclick=()=>{tr.remove();calc()};document.querySelector('#lines').append(tr);calc()}function calc(){let total=0;for(const tr of document.querySelectorAll('#lines tr')){const a=tr.querySelectorAll('input');const n=Math.round(Math.max(0,+a[2].value)*Math.max(0,+a[3].value)*100)/100;tr.querySelector('.sum').textContent=n.toFixed(2);total+=n}document.querySelector('#total').textContent=total.toFixed(2)+' '+document.querySelector('#currency').value}</script><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const msg=document.querySelector('#loginmsg');let client;const main=document.querySelector('main');function hide(){main.hidden=true;document.querySelector('#account').hidden=true;document.querySelector('#login').hidden=false;panel.replaceChildren()}async function refresh(){hide();const {data:{session}}=await client.auth.getSession();if(!session)return;const {data,error}=await client.from('erp_agents').select('nom_complet,actif').eq('id',session.user.id).maybeSingle();if(error||!data?.actif){msg.textContent='Compte ERP non actif ou accès indisponible.';return}document.querySelector('#agentname').textContent=data.nom_complet;document.querySelector('#login').hidden=true;document.querySelector('#account').hidden=false;main.hidden=false;msg.textContent=''}window.loadDirectory=async()=>{const h=document.createElement('p');h.textContent='Chargement…';panel.append(h);const {data,error}=await client.from('erp_agents').select('nom_complet,email,fonction,matricule').eq('actif',true).order('nom_complet');if(!h.isConnected)return;if(error){h.textContent='Annuaire indisponible.';return}h.remove();const search=document.createElement('input');search.placeholder='Rechercher un agent';panel.append(search);const results=document.createElement('div');panel.append(results);function render(){results.replaceChildren();for(const a of data.filter(a=>Object.values(a).join(' ').toLowerCase().includes(search.value.toLowerCase()))){const p=document.createElement('p');p.textContent=[a.nom_complet,a.fonction,a.matricule,a.email].join(' · ');results.append(p)}}search.oninput=render;render()};try{const response=await fetch('../admin/config.json',{cache:'no-store'});if(!response.ok)throw Error();const cfg=await response.json();client=createClient(cfg.url,cfg.publishableKey,{auth:{storageKey:'semad-erp-auth'}});document.querySelector('#loginform').onsubmit=async e=>{e.preventDefault();msg.textContent='Connexion…';const password=document.querySelector('#password');const {error}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:password.value});password.value='';if(error){msg.textContent='Connexion impossible. Vérifiez vos identifiants.';return}await refresh()};document.querySelector('#logout').onclick=async()=>{hide();await client.auth.signOut()};client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')hide()});await refresh()}catch(e){msg.textContent='Service de connexion indisponible.'}</script></html>
