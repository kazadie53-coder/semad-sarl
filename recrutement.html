<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Consultez les offres d'emploi et opportunités de recrutement de SEMAD SARL à Kolwezi."><title>Offres d’emploi et recrutement à Kolwezi | SEMAD SARL</title><link rel="canonical" href="https://kazadie53-coder.github.io/semad-sarl/recrutement.html"><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:locale" content="fr_CD"><meta property="og:site_name" content="SEMAD SARL"><meta property="og:title" content="Offres d’emploi et recrutement | SEMAD SARL Kolwezi"><meta property="og:description" content="Consultez les offres d’emploi officiellement publiées par SEMAD SARL à Kolwezi, Lualaba, RDC."><meta property="og:url" content="https://kazadie53-coder.github.io/semad-sarl/recrutement.html"><meta property="og:image" content="https://kazadie53-coder.github.io/semad-sarl/logo-semad.png"><link rel="icon" href="logo-semad.png"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#173451;font:16px/1.6 system-ui,Arial}header{background:#102c54;color:white;padding:24px 5%}header a{color:white}main{max-width:900px;margin:auto;padding:24px 16px 60px}.offer{background:white;border-radius:12px;padding:24px;margin:18px 0;box-shadow:0 4px 20px #1231}.offer h2{margin:0 0 8px}.meta{color:#53697b}.deadline{font-weight:700;color:#805a13}h3{margin-bottom:4px}p{white-space:pre-line}.empty{background:white;border-radius:12px;padding:24px}a{color:#145d9c}</style></head><body><header><a href="./">← Retour au site SEMAD SARL</a><h1>Recrutement</h1><p>Offres d'emploi et opportunités professionnelles</p></header><main><p>Consultez les offres publiées par SEMAD SARL. Chaque annonce précise les modalités de candidature.</p><div id="jobs" aria-live="polite">Chargement des offres…</div></main><script type="module">
const box=document.getElementById('jobs');const para=(parent,label,value)=>{if(!value)return;const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=value;parent.append(h,p)};
try{const config=await fetch('./admin/config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Configuration');return r.json()});const response=await fetch(config.url+'/rest/v1/semad_posts?select=title,date,content&title=like.%5BRECRUTEMENT%5D%20*&order=date.desc',{headers:{apikey:config.publishableKey},cache:'no-store'});if(!response.ok)throw Error('Chargement impossible');const rows=await response.json();box.replaceChildren();let count=0;for(const p of rows){let j;try{j=JSON.parse(p.content)}catch{continue}if(!j.title)continue;count++;const article=document.createElement('article');article.className='offer';const title=document.createElement('h2');title.textContent=j.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=[j.location,j.contract].filter(Boolean).join(' • ');article.append(title,meta);if(j.deadline){const dl=document.createElement('p');dl.className='deadline';dl.textContent='Date limite : '+new Date(j.deadline+'T12:00:00').toLocaleDateString('fr-FR');article.append(dl)}para(article,'Missions',j.missions);para(article,'Profil et conditions',j.requirements);para(article,'Comment postuler',j.apply);box.append(article)}if(!count)box.innerHTML='<p class="empty">Aucune offre d’emploi publiée pour le moment. Consultez cette page régulièrement.</p>'}catch(e){box.textContent='Impossible de charger les offres pour le moment. Veuillez réessayer plus tard.';console.error(e)}
</script></body></html>
