<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;color:#173451;background:#f4f7fb;margin:0}main{max-width:850px;margin:32px auto;padding:24px;background:white}header{display:flex;align-items:center;gap:20px;border-bottom:3px solid #c49a43;padding-bottom:18px}a{color:#145d9c}button,input{font:inherit;padding:12px}button{background:#173451;color:white;border:0;border-radius:6px;cursor:pointer}li{margin:10px 0}@media print{body{background:white}main{margin:0;padding:0}.no-print{display:none}}</style><title>Vérification documentaire SEMAD SARL</title></head><body><main><header><img src="logo-semad.png" width="75" alt="SEMAD SARL"><h1>Vérification des documents</h1></header><p>Scannez le QR code d’un document SEMAD SARL ou saisissez sa référence.</p><form id="check"><label for="ref">Référence documentaire</label><br><input id="ref" required maxlength="100" autocomplete="off"><button>Vérifier</button></form><p id="result" role="status"></p><p>Une référence reconnue ne garantit pas que le contenu du document présenté est identique à l’original. En cas de doute, contactez la direction.</p><a href="mailto:semad.developpementsarl@gmail.com">Contacter SEMAD SARL</a> · <a href="./">Retour au site</a></main><script>const field=document.getElementById('ref'),out=document.getElementById('result');async function verify(){out.textContent='Vérification en cours…';try{const r=await fetch('documents-registre.json',{cache:'no-store'});if(!r.ok)throw Error();const list=await r.json();const d=list.find(x=>x.reference===field.value.trim().toUpperCase());out.textContent=d?(d.status==='valide'?'Référence enregistrée : ':'Document non valide : ')+d.title+' — '+d.date:'Référence non enregistrée. Authenticité non confirmée.';}catch{out.textContent='Registre indisponible. Authenticité non confirmée.';}}document.getElementById('check').addEventListener('submit',e=>{e.preventDefault();verify()});field.value=new URLSearchParams(location.search).get('ref')||'';if(field.value)verify();</script></body></html>
