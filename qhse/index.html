<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEMAD SARL | Formation QHSE</title><link rel="icon" href="../logo-semad.png"><style>body{margin:0;font:16px system-ui;color:#102b4b;background:#f1f5f9}header{background:#102b4b;color:white;padding:24px;border-bottom:4px solid #c4a45f;display:flex;gap:16px;align-items:center}header img{width:64px}h1{font-size:24px}main{max-width:900px;margin:24px auto;padding:16px}article{background:white;border:1px solid #dce4ee;border-radius:12px;padding:20px;margin:16px 0}button,a{color:#102b4b}button{padding:10px 16px;border:1px solid #102b4b;border-radius:8px;background:white;cursor:pointer}label{display:block;padding:8px}progress{width:100%}[hidden]{display:none!important}</style></head><body><header><img src="../logo-semad.png" alt="SEMAD"><h1>SEMAD SARL — Formation QHSE</h1></header><main><p id="status">Vérification du compte…</p><section id="content" hidden><a href="../portail/">Retour au portail</a><h2>Parcours de sensibilisation QHSE</h2><p>Qualité, hygiène, sécurité et environnement. Ce parcours introductif ne remplace pas les formations pratiques, habilitations et consignes propres à chaque site.</p><p id="score">0 / 8 modules réussis</p><progress id="progress" max="8" value="0"></progress><div id="courses"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const status=document.querySelector('#status');try{const cfg=await(await fetch('../admin/config.json',{cache:'no-store'})).json();const client=createClient(cfg.url,cfg.publishableKey,{auth:{storageKey:'semad-erp-auth'}});const{data:{session}}=await client.auth.getSession();if(!session)throw Error('Veuillez vous connecter au portail.');const r=await client.from('erp_agents').select('actif,nom_complet').eq('id',session.user.id).maybeSingle();if(r.error||!r.data?.actif)throw Error('Compte non autorisé.');status.textContent=r.data.nom_complet;document.querySelector('#content').hidden=false;const courses=[["Induction QHSE","Respecter les consignes du site, identifier les dangers avant toute tâche, arrêter une activité dangereuse et prévenir le responsable. Ne reprendre qu'après maîtrise du risque.","Que faire devant un danger non maîtrisé ?",["Continuer rapidement","Arrêter et signaler","Ignorer"],1],["Équipements de protection individuelle","Porter les EPI adaptés à la tâche et au risque, vérifier leur état avant usage et signaler tout défaut. Les EPI complètent les mesures de prévention collective.","Un EPI est endommagé. Que faire ?",["Le remplacer avant utilisation","Le porter quand même","Le prêter"],0],["Analyse des risques","Identifier les dangers, évaluer les risques et privilégier élimination, substitution et protections collectives avant les EPI. Réévaluer si les conditions changent.","Quand réévaluer les risques ?",["Jamais","Seulement en fin de journée","Lorsque les conditions changent"],2],["Incidents et presque-accidents","Mettre en sécurité sans s'exposer, alerter le responsable et signaler les incidents et presque-accidents. Préserver les faits pour l'enquête.","Un presque-accident doit-il être signalé ?",["Oui","Non","Seulement si blessure"],0],["Incendie et évacuation","Déclencher l'alerte selon les consignes locales, évacuer par un itinéraire sûr, rejoindre le point de rassemblement et attendre les instructions. Ne combattre un feu que si formé et sans danger.","Après évacuation, où aller ?",["Au point de rassemblement","Retourner au bureau","Partir sans prévenir"],0],["Premiers secours","Sécuriser la zone, alerter les secours et demander un secouriste formé. Ne pas déplacer une victime sauf danger immédiat. Suivre les instructions des secours.","Qui alerter ?",["Personne","Les secours et le secouriste","Uniquement un collègue"],1],["Environnement et qualité","Trier les déchets selon les consignes locales, prévenir les déversements, signaler les anomalies et respecter les procédures de travail. Ne pas manipuler un produit inconnu.","Que faire devant un déversement inconnu ?",["Le toucher","Le jeter à l'égout","Isoler si possible et alerter"],2],["Comportement professionnel","Respecter les collègues, participer aux causeries sécurité, éviter les distractions et signaler toute situation dangereuse sans crainte. Ne pas effectuer de tâche sans compétence ou autorisation requise.","Une tâche exige une habilitation que vous n'avez pas. Que faire ?",["Refuser de commencer et informer le responsable","Essayer seul","Demander à un collègue de couvrir"],0]];const passed=new Set();courses.forEach(([title,lesson,question,answers,correct],i)=>{const a=document.createElement('article');const h=document.createElement('h3');h.textContent=(i+1)+'. '+title;const p=document.createElement('p');p.textContent=lesson;const q=document.createElement('strong');q.textContent=question;a.append(h,p,q);answers.forEach((answer,j)=>{const l=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;l.append(input,' '+answer);a.append(l)});const b=document.createElement('button'),feedback=document.createElement('p');b.textContent='Vérifier ma réponse';feedback.setAttribute('role','status');b.onclick=()=>{const selected=a.querySelector('input:checked');if(!selected){feedback.textContent='Choisissez une réponse.';return}if(Number(selected.value)===correct){passed.add(i);feedback.textContent='Bonne réponse.'}else{feedback.textContent='Réponse incorrecte. Relisez le module et réessayez.'}document.querySelector('#score').textContent=passed.size+' / '+courses.length+' modules réussis';document.querySelector('#progress').value=passed.size};a.append(b,feedback);document.querySelector('#courses').append(a)});client.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'){document.querySelector('#content').hidden=true;status.textContent='Session terminée. Reconnectez-vous au portail.'}})}catch(e){status.textContent=e.message;const a=document.createElement('a');a.href='../portail/';a.textContent=' Se connecter';status.append(a)}</script></body></html>
