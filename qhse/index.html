<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEMAD SARL | Formation QHSE</title><link rel="icon" href="../logo-semad.png"><style>body{margin:0;font:16px system-ui;color:#102b4b;background:#f1f5f9}header{background:#102b4b;color:white;padding:24px;border-bottom:4px solid #c4a45f;display:flex;gap:16px;align-items:center}header img{width:64px}h1{font-size:24px}main{max-width:900px;margin:24px auto;padding:16px}article{background:white;border:1px solid #dce4ee;border-radius:12px;padding:20px;margin:16px 0}button,a{color:#102b4b}button{padding:10px 16px;border:1px solid #102b4b;border-radius:8px;background:white;cursor:pointer}label{display:block;padding:8px}progress{width:100%}[hidden]{display:none!important}</style></head><body><header><img src="../logo-semad.png" alt="SEMAD"><h1>SEMAD SARL — Formation QHSE</h1></header><main><p id="status">Vérification du compte…</p><section id="content" hidden><a href="../portail/">Retour au portail</a><h2>Parcours de sensibilisation QHSE</h2><p>Qualité, hygiène, sécurité et environnement. Ce parcours introductif ne remplace pas les formations pratiques, habilitations et consignes propres à chaque site.</p><p id="score">0 / 8 modules réussis</p><progress id="progress" max="8" value="0"></progress><div id="courses"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const status=document.querySelector('#status');try{const cfg=await(await fetch('../admin/config.json',{cache:'no-store'})).json();const client=createClient(cfg.url,cfg.publishableKey,{auth:{storageKey:'semad-erp-auth'}});const{data:{session}}=await client.auth.getSession();if(!session)throw Error('Veuillez vous connecter au portail.');const r=await client.from('erp_agents').select('actif,nom_complet').eq('id',session.user.id).maybeSingle();if(r.error||!r.data?.actif)throw Error('Compte non autorisé.');status.textContent=r.data.nom_complet;document.querySelector('#content').hidden=false;const lessons=[["Induction QHSE","Respecter les consignes du site, identifier les dangers avant toute tâche, arrêter une activité dangereuse et prévenir le responsable. Ne reprendre qu'après maîtrise du risque."],["Équipements de protection individuelle","Porter les EPI adaptés à la tâche et au risque, vérifier leur état avant usage et signaler tout défaut. Les EPI complètent les mesures de prévention collective."],["Analyse des risques","Identifier les dangers, évaluer les risques et privilégier élimination, substitution et protections collectives avant les EPI. Réévaluer si les conditions changent."],["Incidents et presque-accidents","Mettre en sécurité sans s'exposer, alerter le responsable et signaler les incidents et presque-accidents. Préserver les faits pour l'enquête."],["Incendie et évacuation","Déclencher l'alerte selon les consignes locales, évacuer par un itinéraire sûr, rejoindre le point de rassemblement et attendre les instructions. Ne combattre un feu que si formé et sans danger."],["Premiers secours","Sécuriser la zone, alerter les secours et demander un secouriste formé. Ne pas déplacer une victime sauf danger immédiat. Suivre les instructions des secours."],["Environnement et qualité","Trier les déchets selon les consignes locales, prévenir les déversements, signaler les anomalies et respecter les procédures de travail. Ne pas manipuler un produit inconnu."],["Comportement professionnel","Respecter les collègues, participer aux causeries sécurité, éviter les distractions et signaler toute situation dangereuse sans crainte. Ne pas effectuer de tâche sans compétence ou autorisation requise."]];const questions=[{"id":1,"module":"Induction QHSE","question":"Que faire devant un danger non maîtrisé ?","options":["Continuer rapidement","Arrêter et signaler","Ignorer"]},{"id":2,"module":"Induction QHSE","question":"Avant une tâche, que vérifier ?","options":["Les dangers et consignes","La météo uniquement","Rien"]},{"id":3,"module":"Induction QHSE","question":"Une consigne est incomprise ?","options":["Deviner","Demander clarification","Ignorer"]},{"id":4,"module":"Induction QHSE","question":"Qui contribue à la sécurité ?","options":["Seulement HSE","Seulement DG","Tous les agents"]},{"id":5,"module":"Induction QHSE","question":"Une zone est interdite ?","options":["Respecter le balisage","Entrer rapidement","Retirer le panneau"]},{"id":6,"module":"Équipements de protection individuelle","question":"Un EPI est endommagé. Que faire ?","options":["Le remplacer avant utilisation","Le porter quand même","Le prêter"]},{"id":7,"module":"Équipements de protection individuelle","question":"Choix des EPI ?","options":["Selon le risque","Selon la couleur","Au hasard"]},{"id":8,"module":"Équipements de protection individuelle","question":"Les EPI remplacent-ils les protections collectives ?","options":["Oui","Non","Toujours"]},{"id":9,"module":"Équipements de protection individuelle","question":"Avant usage ?","options":["Inspecter les EPI","Les modifier","Les partager sans contrôle"]},{"id":10,"module":"Équipements de protection individuelle","question":"Protection auditive ?","options":["Selon évaluation du bruit","Jamais","Seulement dehors"]},{"id":11,"module":"Analyse des risques","question":"Quand réévaluer les risques ?","options":["Jamais","Seulement en fin de journée","Lorsque les conditions changent"]},{"id":12,"module":"Analyse des risques","question":"Priorité de prévention ?","options":["Éliminer le danger","Distribuer des EPI uniquement","Ignorer"]},{"id":13,"module":"Analyse des risques","question":"Un danger est ?","options":["Une source potentielle de dommage","Un salaire","Un rapport"]},{"id":14,"module":"Analyse des risques","question":"Un risque combine ?","options":["Probabilité et gravité","Prix et quantité","Date et heure"]},{"id":15,"module":"Analyse des risques","question":"Avant une tâche nouvelle ?","options":["Évaluer les risques","Commencer seul","Attendre un accident"]},{"id":16,"module":"Incidents et presque-accidents","question":"Un presque-accident doit-il être signalé ?","options":["Oui","Non","Seulement si blessure"]},{"id":17,"module":"Incidents et presque-accidents","question":"Après un incident ?","options":["Alerter et sécuriser sans exposition","Cacher les faits","Effacer les traces"]},{"id":18,"module":"Incidents et presque-accidents","question":"Le rapport doit être ?","options":["Factuel","Inventé","Anonyme obligatoirement"]},{"id":19,"module":"Incidents et presque-accidents","question":"But de l'enquête ?","options":["Prévenir la répétition","Punir systématiquement","Cacher"]},{"id":20,"module":"Incidents et presque-accidents","question":"Un témoin doit ?","options":["Rapporter les faits observés","Inventer","Se taire"]},{"id":21,"module":"Incendie et évacuation","question":"Après évacuation, où aller ?","options":["Au point de rassemblement","Retourner au bureau","Partir sans prévenir"]},{"id":22,"module":"Incendie et évacuation","question":"Une alarme retentit ?","options":["Suivre les consignes d'évacuation","Finir son travail","Se cacher"]},{"id":23,"module":"Incendie et évacuation","question":"Sortie obstruée ?","options":["Signaler et utiliser un trajet sûr","Forcer le passage dangereux","Ignorer"]},{"id":24,"module":"Incendie et évacuation","question":"Retour dans le bâtiment ?","options":["Après autorisation","Immédiatement","Pour récupérer un sac"]},{"id":25,"module":"Incendie et évacuation","question":"Extincteur ?","options":["Uniquement si formé et conditions sûres","Toujours combattre","Jamais alerter"]},{"id":26,"module":"Premiers secours","question":"Qui alerter ?","options":["Personne","Les secours et le secouriste","Uniquement un collègue"]},{"id":27,"module":"Premiers secours","question":"Avant d'aider ?","options":["Vérifier la sécurité de la zone","Courir sans regarder","Déplacer tout le monde"]},{"id":28,"module":"Premiers secours","question":"Victime inconsciente ?","options":["Alerter les secours et suivre leurs instructions","Donner à boire","La laisser seule"]},{"id":29,"module":"Premiers secours","question":"Matériel de secours ?","options":["Connaître son emplacement","Le cacher","Le verrouiller sans accès"]},{"id":30,"module":"Premiers secours","question":"Soins hors compétence ?","options":["Attendre les secours qualifiés","Improviser","Donner des médicaments inconnus"]},{"id":31,"module":"Environnement et qualité","question":"Que faire devant un déversement inconnu ?","options":["Le toucher","Le jeter à l'égout","Isoler si possible et alerter"]},{"id":32,"module":"Environnement et qualité","question":"Déchets dangereux ?","options":["Suivre la filière prévue","Mélanger","Brûler librement"]},{"id":33,"module":"Environnement et qualité","question":"Fuite détectée ?","options":["Signaler et appliquer les consignes","Ignorer","Laver à l'égout"]},{"id":34,"module":"Environnement et qualité","question":"Produit non conforme ?","options":["Isoler et signaler","Livrer","Masquer"]},{"id":35,"module":"Environnement et qualité","question":"Étiquette chimique ?","options":["Lire avant usage","Retirer","Ignorer"]},{"id":36,"module":"Comportement professionnel","question":"Une tâche exige une habilitation que vous n'avez pas. Que faire ?","options":["Refuser de commencer et informer le responsable","Essayer seul","Demander à un collègue de couvrir"]},{"id":37,"module":"Comportement professionnel","question":"Causerie sécurité ?","options":["Participer activement","Ignorer","Quitter"]},{"id":38,"module":"Comportement professionnel","question":"Fatigue dangereuse ?","options":["Informer le responsable","Cacher","Continuer coûte que coûte"]},{"id":39,"module":"Comportement professionnel","question":"Pression pour travailler dangereusement ?","options":["Arrêter et signaler","Obéir sans réserve","Se taire"]},{"id":40,"module":"Comportement professionnel","question":"Respect des collègues ?","options":["Obligatoire","Facultatif","Réservé aux chefs"]}];const host=document.querySelector('#courses');document.querySelector('#score').textContent='40 questions — soumission finale';document.querySelector('#progress').hidden=true;for(const [module,lesson] of lessons){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=module;const p=document.createElement('p');p.textContent=lesson;a.append(h,p);for(const q of questions.filter(x=>x.module===module)){const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=q.id+'. '+q.question;field.append(legend);q.options.forEach((answer,j)=>{const l=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+q.id;input.value=j;l.append(input,' '+answer);field.append(l)});a.append(field)}host.append(a)}const b=document.createElement('button');b.textContent='Soumettre les 40 réponses';host.append(b);b.onclick=async()=>{const answers={};for(const q of questions){const v=host.querySelector('input[name=q'+q.id+']:checked');if(!v){alert('Répondez à la question '+q.id);return}answers[q.id]=Number(v.value)}b.disabled=true;const r=await client.rpc('erp_qhse_soumettre',{p_reponses:answers});if(r.error){alert(r.error.message);b.disabled=false;return}host.querySelectorAll('input').forEach(x=>x.disabled=true);b.textContent='Évaluation transmise';await results()};async function results(){const r=await client.from('erp_qhse_resultats').select('*').order('created_at',{ascending:false});if(r.error)return;let box=document.querySelector('#results');if(!box){box=document.createElement('section');box.id='results';host.before(box)}box.replaceChildren();const h=document.createElement('h2');h.textContent='Résultats et notifications de formation ('+r.data.length+')';box.append(h);for(const x of r.data){const d=document.createElement('details'),sum=document.createElement('summary');sum.textContent=x.nom+' · '+x.fonction+' · '+x.departement+' · '+x.score+'/'+x.total+' · '+new Date(x.created_at).toLocaleString('fr');d.append(sum);const p=document.createElement('p');p.textContent='Matricule : '+x.matricule;d.append(p);for(const y of x.reponses){const p=document.createElement('p');p.textContent=y.question+' — Réponse : '+y.reponse+' — Correction : '+y.correction;d.append(p)}box.append(d)}}await results();setInterval(results,30000);client.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'){document.querySelector('#content').hidden=true;status.textContent='Session terminée. Reconnectez-vous au portail.'}})}catch(e){status.textContent=e.message;const a=document.createElement('a');a.href='../portail/';a.textContent=' Se connecter';status.append(a)}</script></body></html>
